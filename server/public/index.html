<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>员工产量上报</title>
<style>
  :root{
    --green:#12b886; --green-d:#0ca678;
    --blue:#3b82f6; --red:#e5484d;
    --ink:#1f2329; --muted:#8a94a6; --line:#e5e8ee;
    --bg:#eef1f5; --card:#fff; --ro-bg:#f3f5f8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.5;}
  .wrap{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg);
    display:flex; flex-direction:column;}

  .topbar{position:sticky; top:0; z-index:20; background:var(--card);
    border-bottom:1px solid var(--line);}
  .topbar .row{display:flex; align-items:center; height:48px; padding:0 12px;}
  .topbar .close{font-size:22px; color:#444; width:28px;}
  .topbar .title{flex:1; text-align:center; font-size:17px; font-weight:600;}
  .topbar .more{width:28px; text-align:right; color:#444; font-size:20px; cursor:pointer;}
  .topbar .url{text-align:center; font-size:11px; color:var(--muted);
    padding-bottom:5px; margin-top:-4px;}
  .accent{height:3px; background:var(--green);}

  .scroll{flex:1; overflow-y:auto; padding:14px 12px 96px;}
  .form-title{font-size:20px; font-weight:700; margin:4px 2px 14px;}

  .field{margin-bottom:16px;}
  .label{font-size:14px; margin-bottom:7px; color:#333;}
  .req::before{content:"*"; color:var(--red); margin-right:3px;}
  .ctrl{width:100%; height:44px; padding:0 12px; font-size:15px;
    border:1px solid var(--line); border-radius:8px; background:var(--card);
    color:var(--ink); outline:none; appearance:none; font-family:inherit;}
  .ctrl::placeholder{color:#c2c8d2;}
  .ctrl:focus{border-color:var(--green);}
  select.ctrl{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238a94a6' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:36px;}
  select.ctrl.placeholder-opt{color:#c2c8d2;}
  .ctrl.ro{background:var(--ro-bg); color:#556; border-color:transparent;
    display:flex; align-items:center;}
  .ctrl.ro.empty{color:#c2c8d2;}
  .date-wrap{position:relative;}
  .date-wrap .cal{position:absolute; right:12px; top:50%; transform:translateY(-50%);
    color:var(--muted); pointer-events:none;}
  input[type=date].ctrl{padding-right:36px;}
  .err{color:var(--red); font-size:12px; margin-top:5px; display:none;}
  .err.show{display:block;}

  .section-head{display:flex; align-items:center; justify-content:space-between;
    margin:22px 2px 10px;}
  .section-head .t{font-size:16px; font-weight:600;}
  .section-head .ops{display:flex; align-items:center; gap:14px;}
  .link{color:var(--blue); font-size:13px; background:none; border:none; padding:0;
    cursor:pointer; display:inline-flex; align-items:center; gap:3px; font-family:inherit;}
  .link.add{font-size:20px; line-height:1;}

  .detail{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:14px;}
  .detail-head{display:flex; align-items:center; justify-content:space-between;
    margin:-2px 0 12px;}
  .badge{width:24px; height:24px; border-radius:50%; background:var(--blue);
    color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center;}
  .detail-head .ops{display:flex; gap:14px;}
  .detail-body.collapsed{display:none;}

  .add-record{width:100%; height:44px; border:1px dashed #c9d2e3; border-radius:10px;
    background:var(--card); color:var(--blue); font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px; margin-top:2px; font-family:inherit;}

  .subtotal{margin-top:22px;}
  .subtotal .ctrl.ro{font-weight:600; color:var(--green-d); font-size:16px;}
  .save-row{display:flex; align-items:center; gap:8px; margin:18px 2px 0; font-size:14px; color:#333;}
  .save-row input{width:18px; height:18px; accent-color:var(--green);}
  .reset-row{margin:20px 2px 4px; text-align:center;}
  .reset-link{color:var(--muted); font-size:12px; text-decoration:underline; background:none;
    border:none; cursor:pointer; font-family:inherit;}
  .demo-note{margin:6px 2px 0; text-align:center; color:var(--muted); font-size:11px; line-height:1.6;}

  .footer{position:fixed; left:0; right:0; bottom:0; z-index:20;
    max-width:480px; margin:0 auto; background:var(--card);
    border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom));}
  .submit{width:100%; height:46px; border:none; border-radius:23px; background:var(--green);
    color:#fff; font-size:17px; font-weight:600; cursor:pointer; font-family:inherit;}
  .submit:active{background:var(--green-d);}
  .submit:disabled{opacity:.6;}

  .toast{position:fixed; left:50%; top:38%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,.82); color:#fff; padding:12px 18px; border-radius:10px;
    font-size:14px; z-index:50; max-width:80%; text-align:center; display:none;}
  .toast.show{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="row">
      <div class="close">✕</div>
      <div class="title">员工产量上报</div>
      <div class="more" id="moreBtn" title="重置演示数据">⋯</div>
    </div>
    <div class="url">演示 · 本地数据</div>
    <div class="accent"></div>
  </div>

  <div class="scroll">
    <div class="form-title">员工产量上报</div>

    <div class="field">
      <div class="label req">员工工号</div>
      <input id="empId" class="ctrl" placeholder="请填写内容（试 1001~1004）" inputmode="numeric" autocomplete="off">
      <div class="err" id="empErr">未找到该工号</div>
    </div>

    <div class="field">
      <div class="label req">员工姓名</div>
      <div class="ctrl ro empty" id="empName">暂无内容</div>
    </div>
    <div class="field">
      <div class="label req">员工工厂</div>
      <div class="ctrl ro empty" id="empFactory">暂无内容</div>
    </div>
    <div class="field">
      <div class="label req">员工组别</div>
      <div class="ctrl ro empty" id="empGrp">暂无内容</div>
    </div>

    <div class="field">
      <div class="label req">提交日期</div>
      <div class="date-wrap">
        <input id="reportDate" type="date" class="ctrl">
        <span class="cal">📅</span>
      </div>
    </div>

    <div class="section-head">
      <div class="t">产量明细</div>
      <div class="ops">
        <button class="link add" id="addTop" title="添加记录">＋</button>
        <button class="link" id="toggleAll">⌄ 全部收起</button>
      </div>
    </div>

    <div id="details"></div>

    <button class="add-record" id="addRecord">＋ 添加记录</button>

    <div class="field subtotal">
      <div class="label req">工序工价小计</div>
      <div class="ctrl ro empty" id="subtotal">暂无内容</div>
    </div>

    <label class="save-row">
      <input type="checkbox" id="saveAutofill" checked>
      <span>保存本次提交内容，下次自动填充</span>
    </label>

    <div class="reset-row">
      <button class="reset-link" id="resetBtn">重置演示数据</button>
    </div>
    <div class="demo-note">演示版：数据保存在你当前浏览器本地，各自独立、互不影响。</div>
  </div>

  <div class="footer">
    <button class="submit" id="submitBtn">提交</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const money = n => (Math.round(n*100)/100).toFixed(2);
const fmtQty = n => (n % 1 === 0 ? String(n) : money(n));
const toast = (msg, ms=1800) => {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), ms);
};

/* ---------- 种子数据（原后端 seed 的前端版） ---------- */
const SEED = {
  employees: {
    "1001": {name:"张伟", factory:"华南一厂", grp:"缝纫A组"},
    "1002": {name:"李娜", factory:"华南一厂", grp:"缝纫B组"},
    "1003": {name:"王芳", factory:"华东二厂", grp:"裁剪组"},
    "1004": {name:"刘洋", factory:"华东二厂", grp:"后整组"},
  },
  orders: [
    {order_no:"MO-20260801", style_no:"SH-100", product:"男士长袖衬衫"},
    {order_no:"MO-20260802", style_no:"DR-220", product:"女士连衣裙"},
    {order_no:"MO-20260803", style_no:"TS-330", product:"儿童纯棉T恤"},
  ],
  // 制单工序基准（剩余产量的初始值）
  processes: [
    {order_no:"MO-20260801", proc_code:"GX01", proc_name:"车领",    mnemonic:"CL",   unit_price:0.35, remaining:800},
    {order_no:"MO-20260801", proc_code:"GX02", proc_name:"上袖",    mnemonic:"SX",   unit_price:0.42, remaining:650},
    {order_no:"MO-20260801", proc_code:"GX03", proc_name:"锁边",    mnemonic:"SB",   unit_price:0.28, remaining:1200},
    {order_no:"MO-20260801", proc_code:"GX07", proc_name:"钉纽",    mnemonic:"DN",   unit_price:0.15, remaining:950},
    {order_no:"MO-20260802", proc_code:"GX04", proc_name:"车缝侧骨", mnemonic:"CFCG", unit_price:0.55, remaining:500},
    {order_no:"MO-20260802", proc_code:"GX05", proc_name:"上拉链",  mnemonic:"SLL",  unit_price:0.65, remaining:300},
    {order_no:"MO-20260802", proc_code:"GX08", proc_name:"钉扣",    mnemonic:"DK",   unit_price:0.18, remaining:900},
    {order_no:"MO-20260803", proc_code:"GX02", proc_name:"上袖",    mnemonic:"SX",   unit_price:0.30, remaining:1500},
    {order_no:"MO-20260803", proc_code:"GX03", proc_name:"锁边",    mnemonic:"SB",   unit_price:0.22, remaining:2000},
    {order_no:"MO-20260803", proc_code:"GX06", proc_name:"印花",    mnemonic:"YH",   unit_price:0.40, remaining:700},
  ],
};

/* ---------- 本地存储层（替代 SQLite） ---------- */
const LS_KEY = "prod_report_state_v2";
let STATE = loadState();

function freshState() {
  const remaining = {};
  for (const p of SEED.processes) remaining[p.order_no + "|" + p.proc_code] = p.remaining;
  return { remaining, reports: [], lastByEmp: {} };
}
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const s = freshState(); persist(s); return s;
}
function persist(s = STATE) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {}
}

/* ---------- 业务函数（对应原后端 API） ---------- */
function getEmployee(id) { return SEED.employees[id] || null; }
function getOrders() { return SEED.orders; }
function getProcesses(orderNo) {
  return SEED.processes
    .filter(p => p.order_no === orderNo)
    .map(p => ({...p, remaining: STATE.remaining[p.order_no + "|" + p.proc_code]}));
}
function findProc(orderNo, procCode) {
  const base = SEED.processes.find(p => p.order_no === orderNo && p.proc_code === procCode);
  if (!base) return null;
  return {...base, remaining: STATE.remaining[orderNo + "|" + procCode]};
}
function submitReport(payload) {
  const {emp_id, report_date, items, save_autofill} = payload;
  if (!getEmployee(emp_id)) return {ok:false, error:"员工工号不存在"};
  const resolved = [];
  for (let i=0; i<items.length; i++) {
    const it = items[i], n = i+1;
    const pr = findProc(it.order_no, it.proc_code);
    if (!pr) return {ok:false, error:`第${n}行：制单号/工序代码不匹配`};
    const qty = Number(it.qty);
    if (!(qty > 0)) return {ok:false, error:`第${n}行：产量必须大于0`};
    if (qty > pr.remaining) return {ok:false, error:`第${n}行：产量 ${fmtQty(qty)} 超过剩余产量 ${fmtQty(pr.remaining)}`};
    resolved.push({pr, qty});
  }
  let subtotal = 0;
  const result = [];
  for (const {pr, qty} of resolved) {
    const amount = Math.round(pr.unit_price*qty*100)/100;
    subtotal += amount;
    STATE.remaining[pr.order_no + "|" + pr.proc_code] = Math.round((pr.remaining - qty)*100)/100;
    result.push({order_no:pr.order_no, proc_code:pr.proc_code, qty, amount});
  }
  subtotal = Math.round(subtotal*100)/100;
  const report = {id: STATE.reports.length+1, emp_id, report_date, subtotal, items: result, ts: Date.now()};
  STATE.reports.push(report);
  if (save_autofill) STATE.lastByEmp[emp_id] = items.map(it => ({order_no:it.order_no, proc_code:it.proc_code, qty:Number(it.qty)}));
  persist();
  return {ok:true, report_id:report.id, subtotal, items:result};
}
function getLast(emp_id) {
  const items = STATE.lastByEmp[emp_id];
  return items && items.length ? {found:true, items} : {found:false};
}

/* ---------- 界面逻辑 ---------- */
const ORDERS = getOrders();
let seq = 0;
const rows = new Map();

function loadEmployee() {
  const id = $("#empId").value.trim();
  const setRO = (sel, val) => { const el=$(sel); el.textContent=val||"暂无内容"; el.classList.toggle("empty", !val); };
  if (!id) { setRO("#empName",""); setRO("#empFactory",""); setRO("#empGrp",""); $("#empErr").classList.remove("show"); return; }
  const e = getEmployee(id);
  if (e) { setRO("#empName",e.name); setRO("#empFactory",e.factory); setRO("#empGrp",e.grp); $("#empErr").classList.remove("show"); }
  else { setRO("#empName",""); setRO("#empFactory",""); setRO("#empGrp",""); $("#empErr").classList.add("show"); }
}

function orderOptions(selected) {
  let html = `<option value="" ${selected?"":"selected"} disabled>请选择</option>`;
  for (const o of ORDERS) {
    const label = o.order_no + (o.product ? "（"+o.product+"）" : "");
    html += `<option value="${o.order_no}" ${selected===o.order_no?"selected":""}>${label}</option>`;
  }
  return html;
}

function addRow(preset) {
  seq += 1; const id = seq;
  const el = document.createElement("div");
  el.className = "detail"; el.dataset.id = id;
  el.innerHTML = `
    <div class="detail-head">
      <div class="badge">${id}</div>
      <div class="ops">
        <button class="link js-del">删除</button>
        <button class="link js-collapse">⌃ 收起</button>
      </div>
    </div>
    <div class="detail-body">
      <div class="field">
        <div class="label req">制单号</div>
        <select class="ctrl js-order placeholder-opt">${orderOptions(preset&&preset.order_no)}</select>
      </div>
      <div class="field">
        <div class="label req">工序代码</div>
        <select class="ctrl js-proc placeholder-opt"><option value="" selected disabled>请选择</option></select>
      </div>
      <div class="field">
        <div class="label">制单工序助记码</div>
        <input class="ctrl js-mnemonic" placeholder="请填写内容" autocomplete="off">
      </div>
      <div class="field">
        <div class="label req">工序名称</div>
        <div class="ctrl ro empty js-name">暂无内容</div>
      </div>
      <div class="field">
        <div class="label req">工序单价</div>
        <div class="ctrl ro empty js-price">暂无内容</div>
      </div>
      <div class="field">
        <div class="label req">产量</div>
        <input class="ctrl js-qty" inputmode="decimal" placeholder="请填写数值" autocomplete="off">
        <div class="err js-qty-err"></div>
      </div>
      <div class="field" style="margin-bottom:0">
        <div class="label req">工序剩余产量</div>
        <div class="ctrl ro empty js-remaining">暂无内容</div>
      </div>
    </div>`;
  $("#details").appendChild(el);
  rows.set(id, {el, proc:null});

  const orderSel = $(".js-order", el), procSel = $(".js-proc", el);
  el.querySelector(".js-del").onclick = () => { rows.delete(id); el.remove(); renumber(); recalc(); };
  el.querySelector(".js-collapse").onclick = (ev) => {
    const collapsed = $(".detail-body", el).classList.toggle("collapsed");
    ev.currentTarget.innerHTML = collapsed ? "⌄ 展开" : "⌃ 收起";
  };
  orderSel.onchange = () => { orderSel.classList.remove("placeholder-opt"); fillProcOptions(el, orderSel.value, null); clearProcDetail(el); };
  procSel.onchange = () => { procSel.classList.remove("placeholder-opt"); applyProc(el, orderSel.value, procSel.value); };
  $(".js-qty", el).oninput = () => { validateRow(el); recalc(); };

  if (preset && preset.order_no) {
    fillProcOptions(el, preset.order_no, preset.proc_code);
    orderSel.classList.remove("placeholder-opt");
    if (preset.proc_code) {
      procSel.classList.remove("placeholder-opt");
      applyProc(el, preset.order_no, preset.proc_code);
      if (preset.qty != null) { $(".js-qty", el).value = preset.qty; validateRow(el); recalc(); }
    }
  }
  return el;
}

function fillProcOptions(el, orderNo, selectedCode) {
  const procSel = $(".js-proc", el);
  procSel.innerHTML = `<option value="" ${selectedCode?"":"selected"} disabled>请选择</option>`;
  if (!orderNo) return;
  for (const p of getProcesses(orderNo)) {
    const opt = document.createElement("option");
    opt.value = p.proc_code; opt.textContent = p.proc_code + " " + p.proc_name;
    if (selectedCode === p.proc_code) opt.selected = true;
    procSel.appendChild(opt);
  }
  if (selectedCode) procSel.classList.remove("placeholder-opt");
}

function clearProcDetail(el) {
  const set = (sel) => { const x=$(sel,el); x.textContent="暂无内容"; x.classList.add("empty"); };
  set(".js-name"); set(".js-price"); set(".js-remaining");
  $(".js-proc", el).value=""; $(".js-proc", el).classList.add("placeholder-opt");
  rows.get(+el.dataset.id).proc = null; validateRow(el); recalc();
}

function applyProc(el, orderNo, procCode) {
  if (!orderNo || !procCode) return;
  const p = findProc(orderNo, procCode);
  if (!p) return;
  const put = (sel, val) => { const x=$(sel,el); x.textContent=val; x.classList.remove("empty"); };
  put(".js-name", p.proc_name); put(".js-price", money(p.unit_price)); put(".js-remaining", fmtQty(p.remaining));
  const mn = $(".js-mnemonic", el); if (!mn.value) mn.value = p.mnemonic || "";
  rows.get(+el.dataset.id).proc = p; validateRow(el); recalc();
}

function validateRow(el) {
  const rec = rows.get(+el.dataset.id);
  const qtyEl = $(".js-qty", el), errEl = $(".js-qty-err", el);
  const qty = parseFloat(qtyEl.value);
  errEl.classList.remove("show");
  if (!rec.proc || qtyEl.value === "") return true;
  if (isNaN(qty) || qty <= 0) { errEl.textContent="产量必须大于0"; errEl.classList.add("show"); return false; }
  if (qty > rec.proc.remaining) { errEl.textContent=`超过剩余产量 ${fmtQty(rec.proc.remaining)}`; errEl.classList.add("show"); return false; }
  return true;
}

function renumber() { let i=0; for (const el of $("#details").children) { i++; $(".badge", el).textContent = i; } }

function recalc() {
  let sum=0, has=false;
  for (const [,rec] of rows) {
    const qty = parseFloat($(".js-qty", rec.el).value);
    if (rec.proc && !isNaN(qty) && qty>0) { sum += rec.proc.unit_price*qty; has=true; }
  }
  const el = $("#subtotal");
  el.textContent = has ? money(sum) : "暂无内容";
  el.classList.toggle("empty", !has);
}

let allCollapsed = false;
$("#toggleAll").onclick = () => {
  allCollapsed = !allCollapsed;
  for (const el of $("#details").children) {
    $(".detail-body", el).classList.toggle("collapsed", allCollapsed);
    $(".js-collapse", el).innerHTML = allCollapsed ? "⌄ 展开" : "⌃ 收起";
  }
  $("#toggleAll").innerHTML = allCollapsed ? "⌄ 全部展开" : "⌃ 全部收起";
};
$("#addRecord").onclick = () => addRow();
$("#addTop").onclick = () => addRow();
$("#empId").addEventListener("change", loadEmployee);
$("#empId").addEventListener("blur", loadEmployee);

$("#submitBtn").onclick = () => {
  const empId = $("#empId").value.trim();
  if (!empId) return toast("请填写员工工号");
  if ($("#empName").classList.contains("empty")) return toast("员工工号无效");
  const items = [];
  for (const el of $("#details").children) {
    const orderNo = $(".js-order", el).value, procCode = $(".js-proc", el).value;
    const qty = parseFloat($(".js-qty", el).value);
    const n = $(".badge", el).textContent;
    if (!orderNo || !procCode) return toast(`第${n}行：请选择制单号和工序`);
    if (!validateRow(el) || isNaN(qty)) return toast(`第${n}行：产量不合法`);
    items.push({order_no:orderNo, proc_code:procCode, qty});
  }
  if (!items.length) return toast("请至少添加一条产量明细");

  const res = submitReport({emp_id:empId, report_date:$("#reportDate").value, save_autofill:$("#saveAutofill").checked, items});
  if (!res.ok) return toast(res.error, 2600);
  toast(`提交成功 ✓  工价小计 ¥${money(res.subtotal)}`, 2600);
  $("#details").innerHTML=""; rows.clear(); seq=0; recalc();
  if ($("#saveAutofill").checked) { const last = getLast(empId); if (last.found) { last.items.forEach(it => addRow(it)); return; } }
  addRow();
};

$("#resetBtn").onclick = () => {
  if (!confirm("重置演示数据？将清空所有上报记录并恢复初始剩余产量。")) return;
  STATE = freshState(); persist();
  $("#details").innerHTML=""; rows.clear(); seq=0; recalc(); addRow();
  toast("已重置演示数据");
};
$("#moreBtn").onclick = () => $("#resetBtn").click();

/* ---------- 初始化 ---------- */
(function init(){
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  $("#reportDate").value = d.toISOString().slice(0,10);
  addRow();
})();
</script>
</body>
</html>

services:
  - type: web
    name: production-report-demo
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/production.db
    # 数据持久化：将 plan 升级为 starter 或以上后可启用 disk，
    # 挂载到 /data 后 SQLite 数据在重启/重新部署后不会丢失。
    # disk:
    #   name: sqlite-data
    #   mountPath: /data
    #   sizeGB: 1

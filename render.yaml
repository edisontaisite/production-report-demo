services:
  - type: web
    name: production-report-demo
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/production.db
    # 数据持久化：挂载 SSD 到 /data，SQLite 数据在重启/重新部署后不丢失
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
